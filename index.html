<!doctype html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <title>CSS Grid gyakorlás - Megoldás</title>
    <style>
        .container {
            background-color: lightgray;
            padding: 10px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            grid-template-rows: 80px 120px;
        }

        .container div {
            background-color: steelblue;
            color: white;
            font-size: 30px;
            text-align: center;
            padding: 20px;
        }

        .item1 {
            grid-column: span 2;
        }

        .item2 {
            order: 1;
        }

        .item5 {
            background-color: red !important;
            grid-row: span 2;
        }

        .item6 {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
    </div>
</body>

</html>
